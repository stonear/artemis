<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.svg"
      type="image/svg+xml"
      data-light="%sveltekit.assets%/favicon.svg"
      data-dark="%sveltekit.assets%/icons/icon-dark.svg"
    />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%sveltekit.assets%/icons/icon-180.png"
    />
    <link
      rel="mask-icon"
      href="%sveltekit.assets%/icons/icon-monochrome.svg"
      color="#7254a3"
    />
    <meta name="theme-color" content="#7254a3" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <script>
      (function () {
        let choice = "system";
        try {
          choice = localStorage.getItem("artemis-theme") || "system";
        } catch {}
        const dark =
          choice === "dark" ||
          (choice !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark
          ? "#17191d"
          : "#7254a3";
        const icon = document.querySelector('link[rel="icon"]');
        icon.href = dark ? icon.dataset.dark : icon.dataset.light;
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
